[package]
name = "laplace"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-private"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cookie = "0.18"
croner = "4"
deltalake = { version = "1.0", features = ["azure", "gcs"] }
futures = "0.3"
glob = "0.3"
humantime = "2"
humantime-serde = "1"
openidconnect = "4"
object_store = { version = "0.13", features = ["azure", "gcp"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["form", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json", "migrate", "macros"] }
ssh2 = "0.9"
x509-parser = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-util = "0.7"
toml = "1"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
url = "2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
