apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "laplace.name" . }}
  labels:
    {{- include "laplace.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "laplace.selector" . | nindent 6 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "laplace.name" . }}
  labels:
    {{- include "laplace.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "laplace.name" . }}
                port:
                  name: http
{{- end }}
{{- if .Values.metrics.serviceMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "laplace.name" . }}
  labels:
    {{- include "laplace.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "laplace.selector" . | nindent 6 }}
  endpoints:
    - port: ops
      path: /metrics
      interval: 30s
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laplace.name" . }}
  labels:
    {{- include "laplace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laplace.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
      ports:
        - port: ops
{{- end }}
