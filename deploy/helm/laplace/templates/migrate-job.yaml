{{- if .Values.migrations.enabled }}
# runs before the pods of an install or upgrade, with the schema owner's credentials
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "laplace.name" . }}-migrate
  labels:
    {{- include "laplace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "laplace.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "laplace.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "laplace.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          {{- if .Values.database.host }}
          env:
            {{- include "laplace.database" (dict "root" . "name" "migrations" "role" .Values.database.migrations) | nindent 12 }}
          {{- else }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.migrations }}
          {{- end }}
          securityContext:
            {{- include "laplace.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
{{- end }}
